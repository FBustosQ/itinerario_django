{% extends 'base.html' %}

{% block titulo %}Inicio{% endblock %}

{% block contenido %}

<article class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h4 mb-0">Itinerarios</h1>
            </header>

            <figure class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="thead-dark">
                        <tr>
                            <th>Número</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Salida</th>
                            <th>Llegada</th>
                            <th>Frecuencia</th>
                            <th>Estado</th>
                            <th class="text-center"></th>
                            <th class="text-center"></th>

                        </tr>
                    </thead>

                    <tbody>

                        {% for itinerario in itinerarios %}

                            <tr>
                                <td>{{ itinerario.numero }}</td>
                                <td>{{ itinerario.origen }}</td>
                                <td>{{ itinerario.destino }}</td>
                                <td>{{ itinerario.salida }}</td>
                                <td>{{ itinerario.llegada }}</td>
                                <td>{{ itinerario.frecuencia }}</td>
                                <td>{% with estado=itinerario.estado|lower %}
                                        {% if estado == 'operativo' %}
                                            <span class="estado-operativo">Operativo</span>
                                        {% elif estado == 'con retraso' %}
                                            <span class="estado-retraso">Con Retraso</span>
                                        {% elif estado == 'suspendido' %}
                                            <span class="estado-suspendido"> Suspendido</span>
                                        {% else %}
                                            <span class="badge badge-secondary">Sin especificar</span>
                                        {% endif %}
                                    {% endwith %}</td>
                                <td class="text-center">
                                    <a
                                        href="{% url 'detalle' itinerario.id %}"
                                        class="btn btn-info btn-sm"
                                    >
                                        Ver
                                    </a>
                                </td>
                                <td class="text-center">
                                    <a
                                        href="{% url 'eliminar' itinerario.id %}"
                                        class="btn btn-info btn-sm"
                                    >
                                        Eliminar
                                    </a>
                                </td>
                            </tr>

                        {% empty %}

                            <tr>
                                <td colspan="8" class="text-center text-muted">
                                    No hay itinerarios registradas.
                                </td>
                            </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </figure>

        </div>

    </div>

</article>
{% endblock %}
